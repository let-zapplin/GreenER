services:
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  ollama:
    image: ollama/ollama:latest

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ollama list >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s


  # Baixa o modelo uma única vez no volume e o deixa carregado.
  ollama-init:
    image: ollama/ollama:latest

    depends_on:
      ollama:
        condition: service_healthy

    environment:
      OLLAMA_HOST: http://ollama:11434

    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${OLLAMA_MODEL:-qwen2.5:3b} && ollama run --keepalive 30m ${OLLAMA_MODEL:-qwen2.5:3b} ok >/dev/null"]

    restart: "no"


  backend:
    build:
      context: ./backend

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: development
      PORT: 3000
      NODE_OPTIONS: --use-system-ca

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      
      METRICS_API_URL: ${METRICS_API_URL}
      CARBON_API_URL: ${CARBON_API_URL}
      
      EXTERNAL_API_TIMEOUT_MS: ${EXTERNAL_API_TIMEOUT_MS}
      COLLECTION_INTERVAL_MS: ${COLLECTION_INTERVAL_MS:-60000}
      SERVICE_SYNC_INTERVAL_MS: ${SERVICE_SYNC_INTERVAL_MS:-300000}
      CARBON_INTENSITY_MAX_AGE_MS: ${CARBON_INTENSITY_MAX_AGE_MS:-900000}
      CARBON_INTENSITY_SYNC_INTERVAL_MS: ${CARBON_INTENSITY_SYNC_INTERVAL_MS:-300000}

      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-60000}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}

      CORS_ORIGIN: ${CORS_ORIGIN}

      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./backend:/app
      - /app/node_modules

    healthcheck:
      test:
        [
         "CMD",
         "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  frontend:
    build:
      context: ./frontend

    ports:
      - "5173:5173"

    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: ${VITE_API_URL}
      VITE_MAPTILER_API_KEY: ${VITE_MAPTILER_API_KEY:-}

    depends_on:
      backend:
        condition: service_healthy

    volumes:
      - ./frontend:/app
      - /app/node_modules


volumes:
  postgres_data:
  ollama_data:
